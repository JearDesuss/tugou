<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>土酷 landscape prototype v3 — crisp</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .stage { position:relative; width:100vw; height:100vh; overflow:hidden; }
  .stage > svg {
    position:absolute; inset:0; width:100%; height:100%; display:block;
    filter: saturate(1.35) contrast(1.14);
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- ===== WHY THIS SCENE IS BUILT FROM GEOMETRY, NOT FILTERS =====
         v2 made every organic mass by taking a smooth ellipse and running it
         through feDisplacementMap at scale 34. That does produce an irregular
         edge, but the filter output is rasterised into a buffer and then scaled
         to the viewport, so a full-bleed hero came out looking soft and
         out of focus — an airbrushed green blob where the reference has crisp,
         dense, high-micro-contrast canopy.

         So the shapes are now DRAWN: many small hard-edged clumps, layered dark
         to light. Noise survives only as a light edge-roughening pass at low
         scale, which breaks the geometry's regularity without dissolving it.

         color-interpolation-filters="sRGB" on every filter: the SVG default is
         linearRGB, which visibly desaturates and flattens filtered output. This
         one attribute is most of the difference in punch. -->

    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Rock: anisotropic, so the noise reads as vertical strata -->
    <filter id="strata" x="-6%" y="-6%" width="112%" height="112%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.11" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mist" x="-30%" y="-90%" width="160%" height="280%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- ===== PAINT ===== -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e93da"/>
      <stop offset="34%"  stop-color="#79cbf3"/>
      <stop offset="66%"  stop-color="#c8ecff"/>
      <stop offset="100%" stop-color="#e6f9ec"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0%"   stop-color="#fffce8"/>
      <stop offset="28%"  stop-color="#ffe23c"/>
      <stop offset="58%"  stop-color="#ff9d00"/>
      <stop offset="86%"  stop-color="#ff3f00"/>
      <stop offset="100%" stop-color="#e01500"/>
    </radialGradient>
    <radialGradient id="sunhalo">
      <stop offset="0%"   stop-color="#ffb03a" stop-opacity=".6"/>
      <stop offset="55%"  stop-color="#ffd066" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa9cc"/><stop offset="100%" stop-color="#bcd9ea"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8f56"/><stop offset="100%" stop-color="#8ccb6f"/>
    </linearGradient>
    <linearGradient id="mNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5f24"/><stop offset="100%" stop-color="#4aa832"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%"   stop-color="#9aa279"/><stop offset="30%" stop-color="#77855c"/>
      <stop offset="62%"  stop-color="#4c5b3c"/><stop offset="100%" stop-color="#2f3a26"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cdf3d8"/>
      <stop offset="14%"  stop-color="#5ee2c8"/>
      <stop offset="44%"  stop-color="#0ec4cb"/>
      <stop offset="100%" stop-color="#0a6ea4"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#bfe6f7" stop-opacity=".35"/>
      <stop offset="22%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a8dcf0" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0.2" y2="0">
      <stop offset="0%"   stop-color="#e5006e"/>
      <stop offset="42%"  stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#fff2f7"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7ad83f"/><stop offset="60%" stop-color="#2e8f2b"/>
      <stop offset="100%" stop-color="#12551a"/>
    </linearGradient>

    <!-- ===== REUSABLE PIECES =====
         A canopy clump: a scalloped outline built from arcs. Hard edges, so it
         stays crisp at any scale, and the scallops read as foliage the way the
         painted originals do. No fill here — the caller sets it, so one shape
         serves the dark base, the mid tone and the highlight. -->
    <g id="clump">
      <circle cx="-74" cy="14"  r="34"/>
      <circle cx="-38" cy="-12" r="42"/>
      <circle cx="4"   cy="-28" r="48"/>
      <circle cx="50"  cy="-10" r="42"/>
      <circle cx="86"  cy="18"  r="32"/>
      <circle cx="-12" cy="20"  r="42"/>
      <circle cx="44"  cy="26"  r="36"/>
    </g>

    <!-- One pine: hard triangular tiers. Reads at 12px and at 200px. -->
    <path id="pine" d="M0 0 L-13 26 L-6 26 L-17 46 L-8 46 L-21 68 L21 68 L8 46 L17 46 L6 26 L13 26 Z"/>

    <!-- Lily pad: a disc with a wedge cut. Defined as a true circle so callers
         can rotate it and THEN squash it; rotating an already-squashed ellipse
         shears it into a pointed leaf. -->
    <path id="padshape" d="M97.8 -20.8 A 100 100 0 1 0 97.8 20.8 L 0 0 Z"/>

    <g id="lotus">
      <g fill="url(#petal)" stroke="#c4005e" stroke-width="1.6">
        <ellipse cx="-52" cy="10" rx="20" ry="46" transform="rotate(-42 -52 10)"/>
        <ellipse cx="-28" cy="-6" rx="20" ry="54" transform="rotate(-22 -28 -6)"/>
        <ellipse cx="-8"  cy="-16" rx="20" ry="60" transform="rotate(-8 -8 -16)"/>
        <ellipse cx="14"  cy="-16" rx="20" ry="60" transform="rotate(8 14 -16)"/>
        <ellipse cx="34"  cy="-6" rx="20" ry="54" transform="rotate(22 34 -6)"/>
        <ellipse cx="58"  cy="10" rx="20" ry="46" transform="rotate(42 58 10)"/>
      </g>
      <ellipse cx="3" cy="18" rx="17" ry="12" fill="#ffe14a" stroke="#e0a000" stroke-width="1.8"/>
    </g>

    <clipPath id="lakeclip"><rect x="0" y="596" width="1600" height="404"/></clipPath>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1210" cy="150" r="190" fill="url(#sunhalo)"/>
  <circle cx="1210" cy="150" r="72"  fill="url(#sun)"/>

  <g fill="#fff" opacity=".9" filter="url(#mist)">
    <ellipse cx="320" cy="104" rx="190" ry="16"/>
    <ellipse cx="880" cy="66"  rx="150" ry="13"/>
  </g>

  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".95">
    <g><path d="M420 148 q15 -14 30 0 M450 148 q15 -14 30 0"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 -22; 0 0" dur="19s" repeatCount="indefinite"/></g>
    <g><path d="M520 202 q12 -11 24 0 M544 202 q12 -11 24 0"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 16; 0 0" dur="23s" repeatCount="indefinite"/></g>
    <g><path d="M360 236 q9 -9 19 0 M379 236 q9 -9 19 0"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 96 -10; 0 0" dur="27s" repeatCount="indefinite"/></g>
  </g>

  <!-- ============ RANGES ============ -->
  <g filter="url(#rough)">
    <path fill="url(#mFar)" d="M-20 330 L120 190 L250 300 L400 170 L560 310 L700 210 L860 320 L1010 186 L1180 314 L1340 214 L1500 320 L1640 250 L1640 470 L-20 470 Z"/>
  </g>
  <g filter="url(#rough)">
    <path fill="url(#mMid)" d="M-20 410 L110 296 L240 380 L390 268 L540 396 L700 292 L850 404 L1000 288 L1160 400 L1320 300 L1480 396 L1640 330 L1640 560 L-20 560 Z"/>
  </g>
  <!-- Pines on the mid ridge: cheap, crisp, and instantly readable as forest -->
  <g fill="#12622a" opacity=".92">
    <use href="#pine" transform="translate(150,300) scale(.7)"/>
    <use href="#pine" transform="translate(215,330) scale(.55)"/>
    <use href="#pine" transform="translate(430,276) scale(.8)"/>
    <use href="#pine" transform="translate(500,300) scale(.6)"/>
    <use href="#pine" transform="translate(745,300) scale(.75)"/>
    <use href="#pine" transform="translate(810,326) scale(.55)"/>
    <use href="#pine" transform="translate(1040,296) scale(.8)"/>
    <use href="#pine" transform="translate(1110,322) scale(.6)"/>
    <use href="#pine" transform="translate(1360,308) scale(.7)"/>
  </g>
  <g filter="url(#rough)">
    <path fill="url(#mNear)" d="M-20 486 L120 400 L260 470 L410 392 L560 476 L710 400 L870 480 L1020 398 L1180 478 L1340 404 L1500 474 L1640 420 L1640 620 L-20 620 Z"/>
  </g>

  <!-- ============ CLIFFS + FALLS ============ -->
  <g filter="url(#strata)">
    <path fill="url(#rock)" d="M-30 210 L60 168 L140 190 L196 250 L232 350 L256 470 L268 606 L-30 606 Z"/>
    <path fill="url(#rock)" d="M1630 220 L1540 176 L1462 200 L1400 258 L1360 356 L1332 474 L1324 606 L1630 606 Z"/>
    <path fill="url(#rock)" d="M330 318 L392 272 L448 296 L486 372 L508 486 L516 606 L316 606 Z"/>
    <!-- hard-edged strata lines rather than a soft shading pass -->
    <g stroke="#26301f" stroke-width="2.5" opacity=".45" fill="none">
      <path d="M-10 300 q80 22 150 6 M-10 380 q90 26 170 4 M-10 452 q100 20 190 2"/>
      <path d="M1610 310 q-80 22 -150 6 M1610 388 q-90 24 -170 2 M1610 460 q-100 18 -190 0"/>
      <path d="M336 386 q60 18 116 2 M340 452 q64 16 124 0"/>
    </g>
  </g>

  <g>
    <g clip-path="url(#lakeclip)"></g>
    <!-- Waterfalls: a crisp white body plus hard stripes. No displacement — a
         displaced waterfall reads as a smear, and this is the element the eye
         checks for sharpness. -->
    <g>
      <path fill="url(#fall)" d="M96 236 L164 236 L196 600 L74 600 Z"/>
      <path fill="url(#fall)" d="M372 330 L424 330 L446 598 L358 598 Z"/>
      <path fill="url(#fall)" d="M1424 264 L1500 264 L1520 600 L1400 600 Z"/>
      <g stroke="#fff" stroke-width="2.4" opacity=".85" stroke-linecap="round">
        <path d="M110 250 L96 596 M130 244 L124 596 M150 248 L152 596"/>
        <path d="M384 340 L376 592 M400 336 L400 592 M414 342 L424 592"/>
        <path d="M1440 276 L1424 594 M1462 270 L1462 594 M1484 276 L1500 594"/>
      </g>
      <g stroke="#bfe6f7" stroke-width="1.6" opacity=".7">
        <path d="M120 260 L110 590 M140 256 L138 590"/>
        <path d="M1452 288 L1440 590 M1474 284 L1478 590"/>
      </g>
    </g>
    <g fill="#fff" filter="url(#mist)">
      <ellipse cx="134" cy="598" rx="96" ry="17" opacity=".95"/>
      <ellipse cx="402" cy="594" rx="66" ry="13" opacity=".9"/>
      <ellipse cx="1460" cy="598" rx="88" ry="16" opacity=".92"/>
    </g>
  </g>

  <!-- ============ CANOPY ============
       Layered clumps, dark base first, then mid, then a small bright highlight
       offset toward the sun. Every edge is a real path edge. -->
  <g>
    <g fill="#0d4a18">
      <use href="#clump" transform="translate(80,470) scale(1.5)"/>
      <use href="#clump" transform="translate(230,510) scale(1.15)"/>
      <use href="#clump" transform="translate(-10,560) scale(1.3)"/>
      <use href="#clump" transform="translate(1500,486) scale(1.45)"/>
      <use href="#clump" transform="translate(1360,528) scale(1.1)"/>
    </g>
    <g fill="#1d7a26">
      <use href="#clump" transform="translate(64,452) scale(1.2)"/>
      <use href="#clump" transform="translate(232,494) scale(.92)"/>
      <use href="#clump" transform="translate(-16,542) scale(1.05)"/>
      <use href="#clump" transform="translate(1508,468) scale(1.15)"/>
      <use href="#clump" transform="translate(1362,512) scale(.88)"/>
    </g>
    <g fill="#3fa62c">
      <use href="#clump" transform="translate(50,434) scale(.85)"/>
      <use href="#clump" transform="translate(232,478) scale(.66)"/>
      <use href="#clump" transform="translate(1516,450) scale(.8)"/>
      <use href="#clump" transform="translate(1360,498) scale(.6)"/>
    </g>
    <g fill="#78d63c">
      <use href="#clump" transform="translate(40,420) scale(.5)"/>
      <use href="#clump" transform="translate(228,466) scale(.38)"/>
      <use href="#clump" transform="translate(1522,436) scale(.46)"/>
    </g>
  </g>

  <!-- Shoreline scrub, so the water does not simply stop -->
  <g filter="url(#rough2)">
    <g fill="#17701f">
      <ellipse cx="560" cy="588" rx="90" ry="20"/><ellipse cx="760" cy="592" rx="70" ry="16"/>
      <ellipse cx="980" cy="586" rx="96" ry="19"/><ellipse cx="1180" cy="592" rx="72" ry="16"/>
    </g>
    <g fill="#3fa62c" opacity=".9">
      <ellipse cx="566" cy="580" rx="58" ry="13"/><ellipse cx="988" cy="578" rx="62" ry="13"/>
    </g>
  </g>

  <!-- ============ BLOSSOM TREE ============ -->
  <g>
    <path d="M1268 606 q-24 -96 4 -176 q12 -38 -4 -66" stroke="#4a2f1c" stroke-width="15"
          fill="none" stroke-linecap="round"/>
    <path d="M1274 486 q-54 -28 -78 -68 M1272 440 q56 -26 82 -62" stroke="#4a2f1c"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <g fill="#e2004f">
      <use href="#clump" transform="translate(1196,424) scale(.52)"/>
      <use href="#clump" transform="translate(1286,378) scale(.62)"/>
      <use href="#clump" transform="translate(1362,420) scale(.5)"/>
    </g>
    <g fill="#ff4d75">
      <use href="#clump" transform="translate(1200,410) scale(.36)"/>
      <use href="#clump" transform="translate(1288,364) scale(.44)"/>
      <use href="#clump" transform="translate(1358,406) scale(.34)"/>
    </g>
    <g fill="#ffa8c0">
      <use href="#clump" transform="translate(1290,352) scale(.24)"/>
      <use href="#clump" transform="translate(1206,400) scale(.18)"/>
    </g>
  </g>

  <!-- ============ LAKE ============ -->
  <rect x="0" y="596" width="1600" height="404" fill="url(#water)"/>
  <g clip-path="url(#lakeclip)">
    <rect x="1150" y="596" width="120" height="404" fill="#ffd24a" opacity=".4" filter="url(#mist)"/>
    <g stroke="#fff" stroke-linecap="round" fill="none">
      <g stroke-width="3" opacity=".8">
        <path d="M70 630 h150 M420 652 h180 M900 622 h140 M1180 668 h170 M240 700 h210 M760 714 h150 M60 764 h190">
          <animate attributeName="opacity" values=".2;.9;.2" dur="4.5s" repeatCount="indefinite"/></path>
      </g>
      <g stroke-width="2.2" opacity=".7">
        <path d="M40 666 h120 M600 684 h160 M980 706 h130 M340 738 h180 M880 776 h200 M180 812 h160">
          <animate attributeName="opacity" values=".85;.15;.85" dur="6.2s" repeatCount="indefinite"/></path>
      </g>
    </g>
  </g>

  <!-- Koi -->
  <g>
    <g>
      <ellipse cx="0" cy="0" rx="24" ry="10" fill="#ff5a0a"/>
      <ellipse cx="-8" cy="-3" rx="10" ry="4.5" fill="#fff" opacity=".92"/>
      <path d="M23 0 l19 -11 v22 Z" fill="#ff7d2e" opacity=".9"/>
      <animateMotion dur="21s" repeatCount="indefinite" rotate="auto"
        path="M140 700 C 420 664, 700 748, 980 694 C 1200 650, 1380 712, 1620 680"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#f03000"/>
      <ellipse cx="-6" cy="-2" rx="7" ry="3.5" fill="#fff" opacity=".92"/>
      <path d="M17 0 l15 -8 v16 Z" fill="#ff6a24" opacity=".9"/>
      <animateMotion dur="26s" repeatCount="indefinite" rotate="auto"
        path="M1620 648 C 1200 720, 820 634, 520 712 C 300 776, 140 714, -20 750"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="15" ry="6.5" fill="#ffab00"/>
      <path d="M14 0 l12 -7 v14 Z" fill="#ffc93d" opacity=".9"/>
      <animateMotion dur="17s" repeatCount="indefinite" rotate="auto"
        path="M560 800 C 800 762, 1040 812, 1300 780"/>
    </g>
  </g>

  <!-- ============ LOTUS ============ -->
  <g>
    <g fill="url(#pad)" stroke="#0d4a15" stroke-width="2.6">
      <use href="#padshape" transform="translate(180,884) scale(1,.34) rotate(150) scale(1.05)"/>
      <use href="#padshape" transform="translate(560,946) scale(1,.34) rotate(-30) scale(.86)"/>
      <use href="#padshape" transform="translate(1240,882) scale(1,.34) rotate(205) scale(1.1)"/>
      <use href="#padshape" transform="translate(900,964) scale(1,.34) rotate(40) scale(.78)"/>
      <use href="#padshape" transform="translate(400,840) scale(1,.34) rotate(120) scale(.6)"/>
      <use href="#padshape" transform="translate(1030,924) scale(1,.34) rotate(-70) scale(.72)"/>
      <use href="#padshape" transform="translate(60,968) scale(1,.34) rotate(15) scale(.88)"/>
      <use href="#padshape" transform="translate(1480,986) scale(1,.34) rotate(190) scale(.8)"/>
    </g>
    <g stroke="#0f4d16" stroke-width="6" opacity=".38" fill="none" stroke-linecap="round">
      <g transform="translate(180,884) scale(1,.34) rotate(150) scale(1.05)">
        <path d="M0 0 L94 0 M0 0 L66 -66 M0 0 L-66 -66 M0 0 L-94 0 M0 0 L-66 66"/>
      </g>
      <g transform="translate(1240,882) scale(1,.34) rotate(205) scale(1.1)">
        <path d="M0 0 L94 0 M0 0 L66 -66 M0 0 L-66 -66 M0 0 L-94 0 M0 0 L-66 66"/>
      </g>
    </g>
    <use href="#lotus" transform="translate(280,830)"/>
    <use href="#lotus" transform="translate(1100,806) scale(.84)"/>
    <use href="#lotus" transform="translate(700,898) scale(.7)"/>
    <g transform="translate(860,846)">
      <path d="M0 0 q-18 -38 0 -70 q18 32 0 70Z" fill="url(#petal)" stroke="#c4005e" stroke-width="1.6"/>
      <path d="M0 -6 v40" stroke="#1c7a2a" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ SPARKLES ============ -->
  <g fill="#fff">
    <path d="M470 296 l6 -22 l6 22 l22 6 l-22 6 l-6 22 l-6 -22 l-22 -6 Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M1090 448 l5 -17 l5 17 l17 5 l-17 5 l-5 17 l-5 -17 l-17 -5 Z">
      <animate attributeName="opacity" values="1;0;1" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M840 206 l4 -13 l4 13 l13 4 l-13 4 l-4 13 l-4 -13 l-13 -4 Z">
      <animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></path>
    <path d="M200 716 l5 -17 l5 17 l17 5 l-17 5 l-5 17 l-5 -17 l-17 -5 Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></path>
    <path d="M1330 660 l4 -14 l4 14 l14 4 l-14 4 l-4 14 l-4 -14 l-14 -4 Z">
      <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M660 552 l4 -15 l4 15 l15 4 l-15 4 l-4 15 l-4 -15 l-15 -4 Z">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/></path>
  </g>
</svg>
</div>
</body>
</html>
